<!DOCTYPE html>
<html lang="sk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Ján Vojvoda</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#09090a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #09090a; --line: rgba(255, 255, 255, .13); --text: #ededef; --text-2: #a3a3ab; --text-3: #7b7b84; --red: #ff4d5a; --blue: #4c9dff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); color-scheme: dark; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 560px; }
    .art { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: clamp(11px, 3.4vw, 16px); line-height: 1.2; color: var(--red); white-space: pre; margin-bottom: 32px; }
    h1 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 600; letter-spacing: -.03em; }
    h1 span { display: block; margin-top: 4px; font-size: .6em; font-weight: 400; color: var(--text-3); letter-spacing: 0; }
    p { margin-top: 14px; color: var(--text-2); line-height: 1.6; }
    .path { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: var(--text-3); margin-top: 18px; overflow-wrap: anywhere; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      height: 44px;
      padding: 0 20px;
      border-radius: 10px;
      background: var(--text);
      color: #0a0a0b;
      font-weight: 500;
      text-decoration: none;
    }
    a:hover { background: #fff; }
    a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <pre class="art" aria-hidden="true"> _  _    ___  _  _
| || |  / _ \| || |
| || |_| | | | || |_
|__   _| | | |__   _|
   | | | |_| |  | |
   |_|  \___/   |_|</pre>
    <h1>Stránka sa nenašla <span lang="en">Page not found</span></h1>
    <p>Odkaz je možno nesprávny alebo bol presunutý.<br><span lang="en">The link may be wrong or the page has moved.</span></p>
    <p class="path" id="path"></p>
    <a href="/">← Späť na úvod · Back home</a>
  </main>
  <script>if (/^https?:$/.test(location.protocol)) document.getElementById('path').textContent = location.pathname.slice(0, 120);</script>
</body>

</html>
